server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # No nginx version in the Server header or on nginx's own error pages.
    server_tokens off;

    # Docker's embedded DNS; resolving at request time keeps nginx working
    # when the backend container is recreated with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        # The backend rejects bodies over 1 MiB with a JSON 413 of its own; nginx
        # must pass such bodies through rather than answer with its HTML page.
        # Above 2 MB nginx steps in, with the same JSON as the backend.
        client_max_body_size 2m;
        error_page 413 = @payload_too_large;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"body must be at most 1048576 bytes"}}';
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
