name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage gate (90% statements)
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Backend coverage: ${total}% statements (gate 90%)" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { if (t + 0 < 90) { print "Backend coverage is below the 90% gate"; exit 1 } }'
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Tests with coverage (vitest thresholds fail the run below 90%)
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("fs")
            if (!fs.existsSync("coverage/coverage-summary.json")) process.exit(0)
            const t = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total
            const line = `Frontend coverage: statements ${t.statements.pct}%, branches ${t.branches.pct}%, functions ${t.functions.pct}%, lines ${t.lines.pct}% (thresholds 90%)`
            console.log(line)
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n")
          '
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the compose stack
        run: docker compose up --build -d --wait
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Playwright against http://localhost:3000
        run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Stack logs and teardown
        if: always()
        run: |
          docker compose logs --no-color > compose.log 2>&1 || true
          docker compose down
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: compose-logs
          path: compose.log

  deploy:
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::notice::Coolify secrets not set, skipping deploy"
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$COOLIFY_WEBHOOK_URL" -H "Authorization: Bearer $COOLIFY_TOKEN"
